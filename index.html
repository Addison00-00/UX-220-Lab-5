<!DOCTYPE html>
<html lang="eng">

<head>
    <style>
        :root {
            --main-background: #FFF001;
            --main-foreground: #54C1E6;
            --pane-padding: 5px 42px;
        }

        body {
            background-color: var(--main-background);
            foreground-color: var(--main-foreground);

        }
    </style>
</head>

<body>
    <div class="container">
        <img src="Cyberpunk2077.jpg">
    </div>

    <style>
        .container {
            display: grid;
            place-items: center;
            /* Centers horizontally AND vertically*/
            min-height: 100vh;
            /* Makes the body take up 100% of the screen height */
            margin: 0;
            /* Removes default browser spacing so there's no scrollbar */
        }
    </style>
    <footer>
        <this-year></this-year>
    </footer>
    <script>
        class ThisYear extends HTMLElement {
            connectedCallback() {
                const currentYear = new Date().getFullYear();
                this.innerHTML = `<p>&copy; ${2077}</p>`;
            }
        }
        customElements.define('this-year', ThisYear);
    </script>
</body>

</html>
